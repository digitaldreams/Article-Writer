framework:
    messenger:
        # No failure transport: LlmJob records the failure and keeps the message, and Retry dispatches it again.
        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            llm_primary:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: llm_primary
                    redeliver_timeout: 3600
                retry_strategy:
                    service: App\Shared\LlmRetryStrategy
            llm_secondary:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: llm_secondary
                    redeliver_timeout: 3600
                retry_strategy:
                    service: App\Shared\LlmRetryStrategy
            io:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: io
                retry_strategy:
                    service: App\Shared\LlmRetryStrategy
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default:
                middleware:
                    - doctrine_ping_connection

        routing:
            # Route your messages to the transports
            'App\Author\ImportArticle': io
            'App\Author\AddFeeds\FetchFeed': io
            'App\Author\AnalyzeWriting\ExtractWritingNotes': llm_secondary
            'App\Author\AnalyzeWriting\MergeWritingProfile': llm_secondary
            'App\Author\CrossCheckProfile\CrossCheckProfile': llm_primary
            'App\Planning\References\ExtractReference': io
            'App\Planning\References\DigestReference': llm_secondary
            'App\Planning\Questions\AskQuestions': llm_primary
            'App\Planning\Outline\GenerateOutline': llm_primary
            'App\Planning\Article\WriteArticle': llm_primary
            'App\Planning\Titles\SuggestTitles': llm_primary
            'App\Planning\Share\SuggestPunchlines': llm_primary
            'App\Planning\Poster\SuggestPosters': llm_primary
            'App\Planning\Poster\GeneratePoster': llm_primary
            'App\Planning\FinalCheck\CheckArticle': llm_primary
            'App\Planning\FinalCheck\RefactorArticle': llm_primary
            'App\Planning\Article\RewriteSection': llm_primary

when@test:
    framework:
        messenger:
            transports:
                llm_primary:
                    dsn: 'in-memory://'
                    retry_strategy:
                        service: App\Shared\LlmRetryStrategy
                llm_secondary:
                    dsn: 'in-memory://'
                    retry_strategy:
                        service: App\Shared\LlmRetryStrategy
                io:
                    dsn: 'in-memory://'
                    retry_strategy:
                        service: App\Shared\LlmRetryStrategy
            routing:
                'App\Tests\Shared\Llm\TestLlmMessage': llm_primary
