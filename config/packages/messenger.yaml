framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            llm_primary:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: llm_primary
                    redeliver_timeout: 3600
                retry_strategy:
                    service: App\Shared\LlmRetryStrategy
            llm_secondary:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: llm_secondary
                    redeliver_timeout: 3600
                retry_strategy:
                    service: App\Shared\LlmRetryStrategy
            io:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: io
                retry_strategy:
                    service: App\Shared\LlmRetryStrategy
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default:
                middleware:
                    - doctrine_ping_connection

        routing:
            # Route your messages to the transports
            'App\Setup\ImportArticles\ImportFile': io
            'App\Setup\ImportArticles\ExtractStructureNotes': llm_secondary
            'App\Setup\ImportArticles\MergeStructureProfile': llm_secondary
            'App\Planning\CreatePlan\GeneratePlanTitle': llm_secondary
            'App\Planning\DigestReferences\ExtractReference': io
            'App\Planning\DigestReferences\DigestReference': llm_secondary
            'App\Planning\AskQuestions\AskQuestions': llm_primary
            'App\Planning\GenerateFlows\GenerateFlows': llm_primary
            'App\Planning\GenerateOutline\GenerateOutline': llm_primary
            'App\Planning\FinalCheckup\FinalCheckup': llm_primary
            'App\Planning\WriteArticle\WriteArticle': llm_primary
            'App\Planning\SuggestTitles\SuggestTitles': llm_primary
            'App\Planning\SuggestPunchlines\SuggestPunchlines': llm_primary
            'App\Planning\SuggestPosters\SuggestPosters': llm_primary
            'App\Planning\SuggestPosters\GeneratePoster': llm_primary
            'App\Planning\ReviewArticle\ReviewArticle': llm_primary
            'App\Planning\RewriteSection\RewriteSection': llm_primary

when@test:
    framework:
        messenger:
            transports:
                llm_primary:
                    dsn: 'in-memory://'
                    retry_strategy:
                        service: App\Shared\LlmRetryStrategy
                llm_secondary:
                    dsn: 'in-memory://'
                    retry_strategy:
                        service: App\Shared\LlmRetryStrategy
                io:
                    dsn: 'in-memory://'
                    retry_strategy:
                        service: App\Shared\LlmRetryStrategy
            routing:
                'App\Tests\Shared\Llm\TestLlmMessage': llm_primary
