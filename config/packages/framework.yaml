# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    # Makes the file_link Twig filter build vscode:// links, e.g. "Open in VS Code" on the article page.
    ide: vscode

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    http_client:
        scoped_clients:
            # One LLM call can run up to 30 minutes, and non-streaming calls send no data until the answer is done
            llm.slow:
                scope: '.*'
                timeout: 1800
                max_duration: 1800

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
