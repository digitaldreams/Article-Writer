ai:
    platform:
        ollama:
            endpoint: '%env(OLLAMA_ENDPOINT)%'
            http_client: llm.ollama
        openai:
            api_key: '%env(OPENAI_API_KEY)%'
        anthropic:
            api_key: '%env(ANTHROPIC_API_KEY)%'
        gemini:
            api_key: '%env(GEMINI_API_KEY)%'

    # gpt-6-luna is newer than the bundled OpenAI catalog; same entry as gpt-5.6-luna there.
    model:
        openai:
            gpt-6-luna:
                class: Symfony\AI\Platform\Bridge\OpenAi\Gpt
                capabilities: [input-messages, output-text, output-streaming, tool-calling, output-structured, thinking, input-image, input-pdf]

    # One agent per LLM step. Each system prompt is a hand-edited prompts/*.md file (read when a worker starts);
    # {name} placeholders are filled from the call's template_vars option.
    agent:
        # Plan title from the topic and idea.
        plan_title:
            platform: '%app.ai.secondary_platform%'
            model: '%env(AI_SECONDARY_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/prompts/plan_title_agent.md'
        # Notes of one reference on the Brainstorm tab.
        digest:
            platform: '%app.ai.secondary_platform%'
            model: '%env(AI_SECONDARY_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/prompts/digest_agent.md'
        # How one library article is built and sounds (Author).
        writing_notes:
            platform: '%app.ai.secondary_platform%'
            model: '%env(AI_SECONDARY_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/prompts/writing_notes_agent.md'
        # Merges the writing notes into the writer's profile (Author).
        writing_profile:
            platform: '%app.ai.secondary_platform%'
            model: '%env(AI_SECONDARY_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/prompts/writing_profile_agent.md'
        # Interviewer + reader questions on the Questions tab.
        questions:
            platform: '%app.ai.primary_platform%'
            model: '%env(AI_PRIMARY_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/prompts/questions_agent.md'
        # Every outline round.
        outline:
            platform: '%app.ai.primary_platform%'
            model: '%env(AI_PRIMARY_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/prompts/outline_agent.md'
        # Writes article.md from the approved plan.
        article:
            platform: '%app.ai.primary_platform%'
            model: '%env(AI_PRIMARY_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/prompts/article_agent.md'
        # Reader review on the Improve tab.
        review:
            platform: '%app.ai.primary_platform%'
            model: '%env(AI_PRIMARY_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/prompts/review_agent.md'
        # Rewrites one section on the Improve tab.
        rewrite:
            platform: '%app.ai.primary_platform%'
            model: '%env(AI_PRIMARY_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/prompts/rewrite_agent.md'
        # Title + subtitle suggestions on the titles page; the system prompt is a hand-edited repo file (read when a worker starts).
        title:
            platform: '%app.ai.title_platform%'
            model: '%env(AI_TITLE_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/prompts/title_agent.md'
        # Poster ideas on the poster page; the system prompt is a hand-edited repo file (read when a worker starts).
        poster:
            platform: '%app.ai.poster_platform%'
            model: '%env(AI_POSTER_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/prompts/poster_agent.md'
        # Share punchlines on the share page; runs on the title agent's platform and model. The system prompt is a hand-edited repo file (read when a worker starts).
        share:
            platform: '%app.ai.title_platform%'
            model: '%env(AI_TITLE_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/prompts/share_agent.md'
